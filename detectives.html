<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Once Upon a Time — රහස් පරීක්ෂක කතා 50</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans Sinhala', 'Fredoka', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe 0%, #e0e7ff 52%, #ccfbf1 100%);
            background-attachment: fixed;
            padding: 18px 18px 64px;
            color: #0f172a;
            text-align: center;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* 1. Single Audio Mute Bar */
        .detective-audio-bar {
            max-width: 1240px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
        }

        .mute-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 999px;
            background: linear-gradient(135deg, #0284c7, #0d9488);
            color: #ffffff;
            font-size: 1.02rem;
            font-weight: 700;
            border: 2.5px solid #ffffff;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.25);
            transition: transform 0.2s ease;
        }

        .mute-btn:hover {
            transform: scale(1.04);
        }

        /* 2. Panoramic Image Banner (i.jpg) */
        .detective-panoramic-wrap {
            position: relative;
            max-width: 1240px;
            width: 100%;
            margin: 0 auto 24px;
            aspect-ratio: 21 / 6;
            min-height: 140px;
            max-height: 260px;
            border-radius: 24px;
            overflow: hidden;
            border: 3px solid #ffffff;
            background: linear-gradient(120deg, #93c5fd 0%, #99f6e4 50%, #c7d2fe 100%);
            box-shadow: 0 12px 28px rgba(3, 105, 161, 0.15);
        }

        .detective-panoramic-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .detective-panoramic-img.broken {
            display: none;
        }

        .detective-panoramic-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(15, 23, 42, 0.62) 0%, rgba(15, 23, 42, 0.24) 50%, rgba(15, 23, 42, 0.62) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            pointer-events: none;
        }

        .detective-banner-title {
            font-family: 'Fredoka', 'Noto Sans Sinhala', sans-serif;
            font-size: clamp(1.55rem, 3.2vw, 2.25rem);
            color: #ffffff;
            text-shadow: 0 3px 14px rgba(0, 0, 0, 0.65);
            margin-bottom: 4px;
        }

        .detective-banner-sub {
            font-size: clamp(0.92rem, 1.6vw, 1.1rem);
            color: #f0f9ff;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        }

        /* 3. 50 Detective Stories Grid */
        #detective-list-section {
            max-width: 1240px;
            margin: 0 auto;
        }

        .grid-50 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .story-btn {
            padding: 16px 14px;
            font-size: 1.04rem;
            font-weight: 700;
            line-height: 1.5;
            min-height: 64px;
            border-radius: 18px;
            border: 2.5px solid #ffffff;
            color: #0f172a;
            background: linear-gradient(135deg, #93c5fd 0%, #99f6e4 100%);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .story-btn:nth-child(3n) {
            background: linear-gradient(135deg, #c7d2fe 0%, #a5f3fc 100%);
        }

        .story-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 20px rgba(2, 132, 199, 0.18);
        }

        /* 4. Storytelling Large-Font Detective Reader */
        #reader-section {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.96);
            border: 5px solid #0284c7;
            border-radius: 28px;
            padding: 36px 34px;
            text-align: left;
            box-shadow: 0 18px 40px rgba(3, 105, 161, 0.18);
        }

        #reader-section.active {
            display: block;
        }

        .reader-top-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .story-tag {
            background: #e0f2fe;
            border: 1.5px solid #38bdf8;
            color: #0369a1;
            padding: 5px 15px;
            border-radius: 999px;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .word-tag {
            background: #ccfbf1;
            border: 1.5px solid #2dd4bf;
            color: #0f766e;
            padding: 5px 15px;
            border-radius: 999px;
            font-size: 0.92rem;
            font-weight: 700;
        }

        #reader-title {
            font-family: 'Fredoka', 'Noto Sans Sinhala', sans-serif;
            font-size: clamp(1.75rem, 3.4vw, 2.3rem);
            color: #0369a1;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 2.5px dashed rgba(2, 132, 199, 0.28);
        }

        #reader-text {
            font-size: 1.34rem;
            line-height: 2.18;
            font-weight: 500;
            color: #0f172a;
            white-space: pre-line;
            margin-bottom: 32px;
        }

        .reader-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-back {
            padding: 13px 26px;
            border-radius: 999px;
            background: linear-gradient(45deg, #0284c7, #0d9488);
            color: #ffffff;
            font-size: 1.04rem;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(2, 132, 199, 0.28);
        }

        .btn-next {
            padding: 13px 26px;
            border-radius: 999px;
            background: linear-gradient(45deg, #fbbf24, #f97316);
            color: #0f172a;
            font-size: 1.04rem;
            font-weight: 800;
            box-shadow: 0 8px 18px rgba(249, 115, 22, 0.28);
        }

        @media (max-width: 720px) {
            .detective-panoramic-wrap {
                aspect-ratio: 16 / 6;
                min-height: 125px;
                max-height: 185px;
            }
            #reader-section {
                padding: 24px 18px;
            }
            #reader-text {
                font-size: 1.22rem;
                line-height: 2.04;
            }
        }
    </style>
</head>
<body>

    <!-- Single Audio Mute / Unmute Button -->
    <div class="detective-audio-bar">
        <button type="button" id="detective-mute-btn" class="mute-btn" onclick="toggleDetectiveMute()">
            🔊 Sound On
        </button>
    </div>

    <audio id="detective-audio" src="d.mp3" loop preload="auto"></audio>

    <section id="detective-list-section">
        <!-- Panoramic Banner (i.jpg) -->
        <div class="detective-panoramic-wrap" aria-label="Once Upon a Time Detectives Banner">
            <img
                src="i.jpg"
                alt="Once Upon a Time Detectives Banner"
                class="detective-panoramic-img"
                onerror="this.classList.add('broken')"
            >
            <div class="detective-panoramic-overlay">
                <h1 class="detective-banner-title">Once Upon a Time • 🕵️‍♂️ රහස් පරීක්ෂක කතා 50</h1>
                <p class="detective-banner-sub">එකෝමත් එක කාලෙක වුණු රහස් පරීක්ෂණ, පුංචි ඔයාලට කියලා දෙන විදියට.</p>
            </div>
        </div>

        <!-- 50 Detective Buttons -->
        <div id="story-grid" class="grid-50"></div>
    </section>

    <!-- Story Reader -->
    <section id="reader-section">
        <div class="reader-top-info">
            <span id="reader-num" class="story-tag">පරීක්ෂණය #1 / 50</span>
            <span id="reader-words" class="word-tag">වචන 1,000+</span>
        </div>
        <h2 id="reader-title"></h2>
        <div id="reader-text"></div>
        <div class="reader-actions">
            <button type="button" class="btn-back" onclick="closeReader()">⬅ කතා ලැයිස්තුවට</button>
            <button type="button" class="btn-next" onclick="nextStory()">ඊළඟ පරීක්ෂණය ➡</button>
        </div>
    </section>

    <script>
        const detectiveAudio = document.getElementById('detective-audio');
        const muteBtn = document.getElementById('detective-mute-btn');
        let detectiveMuted = false;

        function syncMuteButton() {
            if (!muteBtn) return;
            muteBtn.textContent = detectiveMuted ? '🔇 Sound Off (Mute)' : '🔊 Sound On';
        }

        function toggleDetectiveMute() {
            detectiveMuted = !detectiveMuted;
            if (detectiveAudio) {
                detectiveAudio.muted = detectiveMuted;
                if (detectiveMuted) {
                    detectiveAudio.pause();
                } else {
                    detectiveAudio.play().catch(() => {});
                }
            }
            try {
                if (window.parent && window.parent !== window) {
                    const parentAudio = window.parent.document.getElementById('bg-audio');
                    if (parentAudio) {
                        parentAudio.muted = detectiveMuted;
                        if (detectiveMuted) {
                            parentAudio.pause();
                        } else {
                            parentAudio.play().catch(() => {});
                        }
                    }
                }
            } catch (err) {}
            syncMuteButton();
        }

        window.addEventListener('load', () => {
            if (!detectiveMuted && detectiveAudio) {
                detectiveAudio.play().catch(() => {});
            }
            syncMuteButton();
        });

        document.addEventListener('pointerdown', () => {
            if (!detectiveMuted && detectiveAudio && detectiveAudio.paused) {
                detectiveAudio.play().catch(() => {});
            }
        }, { once: true });

        const topics = [
            "නැති වුණු පාසල් සීනුව", "පුස්තකාලයේ රහස් පිටුව", "අතුරුදහන් වූ රෝබෝ ආකෘතිය", "මල් වත්තේ රහස් පා සටහන්", "අබිරහස් ලිපි මාලාව",
            "නැති වුණු විද්‍යා ප්‍රශ්න පත්‍රය", "පාසල් උයනේ අමුතු හඬ", "අතුරුදහන් වූ ගණිත පුවරුව", "නැති වුණු පාපන්දුව", "අබිරහස් ටයි පටිය",
            "පරිගණක කාමරයේ යතුරු පුවරුව", "නැති වුණු ශිෂ්‍ය නායක ලාංඡනය", "සඟරාවේ නැති වුණු කවි පිටුව", "ගිනි නිවන උපකරණයේ කැඩුණු සීල් එක", "අබිරහස් පාසල් බෙරයේ හඬ",
            "ත්‍යාග කුසලානයේ නම් තහඩුව", "නැති වුණු චිත්‍ර පොත", "පාසල් බෑගයේ හුවමාරුව", "අබිරහස් පා සටහන් රේඛාව", "නැති වුණු විද්‍යා සටහන් පොත",
            "පාසල් ගෙවත්තේ නැති වුණු පෝච්චිය", "අතුරුදහන් වූ ක්‍රීඩා අත්වැසුම්", "නැති වුණු ශබ්ද විකාශන කේබලය", "අබිරහස් පාසල් දිනපොත", "නැති වුණු භූගෝල සිතියම",
            "පාසල් ශාලාවේ නැති වුණු පුටුව", "අතුරුදහන් වූ පාට පෙට්ටිය", "නැති වුණු කාල සටහන් පුවරුව", "අබිරහස් ගණිත සටහන් කොළය", "නැති වුණු පාසල් කොඩිය",
            "පාසල් පුස්තකාලයේ නැති වුණු කාඩ්පත", "අතුරුදහන් වූ පුංචි බටනලාව", "නැති වුණු මිනුම් පටිය", "අබිරහස් පාසල් තැපැල් පෙට්ටිය", "නැති වුණු විද්‍යා කාචය",
            "පාසල් උද්‍යානයේ නැති වුණු පුවරුව", "අතුරුදහන් වූ ක්‍රීඩා ලකුණු පොත", "නැති වුණු සංගීත ස්වර පිටුව", "අබිරහස් පාසල් මුද්‍රාව", "නැති වුණු පරිගණක මවුසය",
            "පාසල් කලාගාරයේ නැති වුණු පින්සල", "අතුරුදහන් වූ කාල මාපකය", "නැති වුණු පාසල් නිල ඇඳුම් බොත්තම", "අබිරහස් පාසල් සැලැස්ම", "නැති වුණු විද්‍යා පරීක්ෂණ සටහන",
            "පාසල් වත්තේ නැති වුණු ජල බටය", "අතුරුදහන් වූ ක්‍රීඩා තොප්පිය", "නැති වුණු පාසල් සඟරා පිටපත", "අබිරහස් කාමර යතුර", "නැති වුණු අවසන් ඉඟියේ සටහන"
        ];

        function tellDetectiveStory1000Plus(topic) {
            let story =
                `එකෝමත් එක කාලෙක, පුංචි රහස් පරීක්ෂකයෝ පිරිසකට "${topic}" කියන හරිම අපූරු අභිරහසක් හමු වුණා. ` +
                `පුංචි ඔයාලා ළඟින් වාඩි වෙලා අහගෙන ඉන්නකෝ, මම මේ රහස් කතාවත් ඔයාලට ආදරෙන් කියලා දෙන්නම්. ` +
                `මේ දේ වුණාම හැමෝටම පුංචි පුදුමයක් ඇති වුණා, ඒත් අපේ පුංචි රහස් පරීක්ෂකයෝ කලබල වුණේ නැහැ. ` +
                `එයාලා කාචයක් අරගෙන බලනවා වගේ, හොඳින් ඇස් ඇරගෙන හැම පුංචි ඉඟියක්ම හොයන්න පටන් ගත්තා. ` +
                `බිම තිබුණු පුංචි සලකුණක්, සුළඟට ගිය කඩදාසි කැබැල්ලක් වුණත් ලොකු ඉඟියක් වෙන්න පුළුවන් කියලා එයාලා දැනගෙන හිටියා.`;

            const tellDetectiveLines = [
                `ඔයාලා දන්නවද, රහස් හොයනකොට කාටවත් නිකන්ම චෝදනා කරන එක හොඳ නැහැ. පුංචි රහස් පරීක්ෂකයෝ හැමෝගෙන්ම හරිම ලස්සනට, සන්සුන්ව අහලා බැලුවා, මොකද වුණේ කියලා තේරුම් ගන්න උත්සාහ කළා. හොඳින් අහගෙන ඉන්න එකයි, ඉවසීමයි තමයි හොඳ පරීක්ෂකයෙකුගේ ලොකුම ශක්තිය.`,
                `එකතු කරපු පුංචි ඉඟි ටික ටික ගළපද්දී "${topic}" පිටුපස තියෙන ඇත්ත කතාව ලස්සනට එළියට ආවා. කිසිම නරක දෙයක් වෙලා තිබුණේ නැහැ; පුංචි අත්වැරදීමක් හෝ සෙල්ලමකට කරපු දෙයක් තමයි ඒකට හේතුව වෙලා තිබුණේ.`,
                `ඇත්ත හෙළි වුණාම හැමෝටම හිනා ගියා, ලොකු සතුටක් දැනුණා. "${topic}" අභිරහස විසඳපු පුංචි රහස් පරීක්ෂකයන්ට හැමෝම සුබ පැතුවා. බුද්ධියෙන් හිතලා, සාක්ෂි බලලා, සාමකාමීව ප්‍රශ්න විසඳන එක කොච්චර හොඳද කියලා හැමෝම ඉගෙනගත්තා.`,
                `ඔන්න ඔහොම "${topic}" කියන මේ රහස් කතාවත් ලස්සනට ඉවර වුණා. පුංචි ඔයාලත් හැමදාම ඇස් ඇරගෙන, හොඳින් හිතලා බලනවා නම් ඕනෑම පුංචි රහසක් පහසුවෙන් තේරුම් ගන්න පුළුවන්!`
            ];

            const countWords = (txt) => txt.trim().split(/\s+/).filter(Boolean).length;
            let idx = 0;
            while (countWords(story) < 1050) {
                story += `\n\n` + tellDetectiveLines[idx % tellDetectiveLines.length];
                idx++;
            }

            return {
                text: story,
                words: countWords(story)
            };
        }

        const stories = topics.map((t, i) => ({
            index: i,
            title: `${i + 1}. ${t}`,
            ...tellDetectiveStory1000Plus(t)
        }));

        const grid = document.getElementById('story-grid');
        const listSec = document.getElementById('detective-list-section');
        const readerSec = document.getElementById('reader-section');
        let currentIdx = 0;

        function openStory(idx) {
            currentIdx = idx;
            const s = stories[idx];
            document.getElementById('reader-num').textContent = `පරීක්ෂණය #${idx + 1} / 50`;
            document.getElementById('reader-words').textContent = `වචන ${s.words.toLocaleString()}+`;
            document.getElementById('reader-title').textContent = s.title;
            document.getElementById('reader-text').textContent = s.text;
            listSec.style.display = 'none';
            readerSec.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeReader() {
            readerSec.classList.remove('active');
            listSec.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function nextStory() {
            openStory((currentIdx + 1) % stories.length);
        }

        stories.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'story-btn';
            btn.textContent = s.title;
            btn.onclick = () => openStory(i);
            grid.appendChild(btn);
        });
    </script>
</body>
</html>
