<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ළමා රහස් පරීක්ෂක කතා 50</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans Sinhala', 'Fredoka', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe 0%, #e0e7ff 52%, #ccfbf1 100%);
            background-attachment: fixed;
            padding: 36px 20px 64px;
            color: #0f172a;
            text-align: center;
        }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        #detective-list-section { max-width: 1240px; margin: 0 auto; }
        .list-header {
            margin-bottom: 32px;
            padding: 24px 20px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.78);
            border: 2px solid #ffffff;
            box-shadow: 0 10px 24px rgba(3, 105, 161, 0.1);
        }
        .list-header h2 {
            font-family: 'Fredoka', 'Noto Sans Sinhala', sans-serif;
            font-size: clamp(1.75rem, 3.5vw, 2.35rem);
            color: #0369a1;
            margin-bottom: 8px;
        }
        .list-header p { color: #334155; font-size: 1.05rem; font-weight: 600; }
        .grid-50 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
            gap: 15px;
        }
        .story-btn {
            padding: 15px 14px;
            font-size: 0.98rem;
            font-weight: 700;
            line-height: 1.48;
            min-height: 60px;
            border-radius: 16px;
            border: 2px solid #ffffff;
            color: #0f172a;
            background: linear-gradient(135deg, #93c5fd 0%, #99f6e4 100%);
            box-shadow: 0 5px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s ease;
        }
        .story-btn:nth-child(3n) { background: linear-gradient(135deg, #c7d2fe 0%, #a5f3fc 100%); }
        .story-btn:hover { transform: translateY(-3px); }

        #reader-section {
            display: none;
            max-width: 920px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.96);
            border: 5px solid #0284c7;
            border-radius: 26px;
            padding: 36px 32px;
            text-align: left;
            box-shadow: 0 18px 40px rgba(3, 105, 161, 0.18);
        }
        #reader-section.active { display: block; }
        .reader-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
        .pill-sky { background: #e0f2fe; border: 1.5px solid #38bdf8; color: #0369a1; padding: 5px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }
        .pill-teal { background: #ccfbf1; border: 1.5px solid #2dd4bf; color: #0f766e; padding: 5px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }
        #reader-title { font-family: 'Fredoka', 'Noto Sans Sinhala', sans-serif; font-size: 1.9rem; color: #0369a1; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px solid rgba(2,132,199,0.2); }
        #reader-text { font-size: 1.12rem; line-height: 2.05; white-space: pre-line; margin-bottom: 30px; }
        .reader-actions { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .btn-back { padding: 12px 26px; border-radius: 30px; background: linear-gradient(45deg, #0284c7, #0d9488); color: #fff; font-weight: 700; }
        .btn-next { padding: 12px 26px; border-radius: 30px; background: linear-gradient(45deg, #fbbf24, #f97316); color: #0f172a; font-weight: 800; }
    </style>
</head>
<body>
    <audio id="detective-audio" src="d.mp3" loop preload="auto"></audio>

    <section id="detective-list-section">
        <div class="list-header">
            <h2>🕵️‍♂️ ළමා රහස් පරීක්ෂක කතා 50 🔎</h2>
            <p>කැමති කතාවක් ඔබා සම්පූර්ණ දිගු පරීක්ෂණ කතාව කියවන්න.</p>
        </div>
        <div id="story-grid" class="grid-50"></div>
    </section>

    <section id="reader-section">
        <div class="reader-meta">
            <span id="reader-num" class="pill-sky">පරීක්ෂණය #1 / 50</span>
            <span id="reader-words" class="pill-teal">වචන 2,000+</span>
        </div>
        <h2 id="reader-title"></h2>
        <div id="reader-text"></div>
        <div class="reader-actions">
            <button type="button" class="btn-back" onclick="closeReader()">⬅ කතා ලැයිස්තුවට</button>
            <button type="button" class="btn-next" onclick="nextStory()">ඊළඟ පරීක්ෂණය ➡</button>
        </div>
    </section>

    <script>
        const audio = document.getElementById('detective-audio');
        window.addEventListener('load', () => audio.play().catch(() => {}));
        document.addEventListener('pointerdown', () => { if (audio.paused) audio.play().catch(() => {}); }, { once: true });

        const topics = [
            "නැති වුණු පාසල් සීනුව", "පුස්තකාලයේ රහස් පිටුව", "අතුරුදහන් වූ රෝබෝ ආකෘතිය", "මල් වත්තේ රහස් පා සටහන්", "අබිරහස් ලිපි මාලාව",
            "නැති වුණු විද්‍යා ප්‍රශ්න පත්‍රය", "පාසල් උයනේ අමුතු හඬ", "අතුරුදහන් වූ ගණිත පුවරුව", "නැති වුණු පාපන්දුව", "අබිරහස් ටයි පටිය",
            "පරිගණක කාමරයේ යතුරු පුවරුව", "නැති වුණු ශිෂ්‍ය නායක ලාංඡනය", "සඟරාවේ නැති වුණු කවි පිටුව", "ගිනි නිවන උපකරණයේ කැඩුණු සීල් එක", "අබිරහස් පාසල් බෙරයේ හඬ",
            "ත්‍යාග කුසලානයේ නම් තහඩුව", "නැති වුණු චිත්‍ර පොත", "පාසල් බෑගයේ හුවමාරුව", "අබිරහස් පා සටහන් රේඛාව", "නැති වුණු විද්‍යා සටහන් පොත",
            "පාසල් ගෙවත්තේ නැති වුණු පෝච්චිය", "අතුරුදහන් වූ ක්‍රීඩා අත්වැසුම්", "නැති වුණු ශබ්ද විකාශන කේබලය", "අබිරහස් පාසල් දිනපොත", "නැති වුණු භූගෝල සිතියම",
            "පාසල් ශාලාවේ නැති වුණු පුටුව", "අතුරුදහන් වූ පාට පෙට්ටිය", "නැති වුණු කාල සටහන් පුවරුව", "අබිරහස් ගණිත සටහන් කොළය", "නැති වුණු පාසල් කොඩිය",
            "පාසල් පුස්තකාලයේ නැති වුණු කාඩ්පත", "අතුරුදහන් වූ පුංචි බටනලාව", "නැති වුණු මිනුම් පටිය", "අබිරහස් පාසල් තැපැල් පෙට්ටිය", "නැති වුණු විද්‍යා කාචය",
            "පාසල් උද්‍යානයේ නැති වුණු පුවරුව", "අතුරුදහන් වූ ක්‍රීඩා ලකුණු පොත", "නැති වුණු සංගීත ස්වර පිටුව", "අබිරහස් පාසල් මුද්‍රාව", "නැති වුණු පරිගණක මවුසය",
            "පාසල් කලාගාරයේ නැති වුණු පින්සල", "අතුරුදහන් වූ කාල මාපකය", "නැති වුණු පාසල් නිල ඇඳුම් බොත්තම", "අබිරහස් පාසල් සැලැස්ම", "නැති වුණු විද්‍යා පරීක්ෂණ සටහන",
            "පාසල් වත්තේ නැති වුණු ජල බටය", "අතුරුදහන් වූ ක්‍රීඩා තොප්පිය", "නැති වුණු පාසල් සඟරා පිටපත", "අබිරහස් කාමර යතුර", "නැති වුණු අවසන් ඉඟියේ සටහන"
        ];

        function buildLongDetective(num, topic) {
            const blocks = [
                `පරීක්ෂණ වාර්තාව #${num} — "${topic}"\n\nතරුණ රහස් පරීක්ෂකයන්ට මෙවර හමු වූ අභිරහස වූයේ "${topic}" යන්නයි. කලබල නොවී, සිදුවීම වූ ස්ථානය හොඳින් නිරීක්ෂණය කළ ඔවුහු පුංචි ඉඟි, පා සටහන් සහ සටහන් එකින් එක රැස් කළහ. සාක්ෂි නොමැතිව කිසිවෙකුට චෝදනා නොකර, තර්කානුකූලව සිතා බැලීමෙන් සැබෑ තත්ත්වය සොයා ගැනීමට ඔවුහු සමත් වූහ.`,
                `ඉඟි ගැළපීම සහ සැබෑ හේතුව හෙළි වීම\n\nඑකතු කළ ඉඟි වේලාව අනුව පෙළගස්වා බැලූ විට "${topic}" සම්බන්ධ සැබෑ හේතුව පැහැදිලි විය. කිසිදු නරක හෝ හානිකර දෙයක් සිදු වී නොතිබුණු අතර, අත්වැරදීමක් හෝ සැඟවූ කුඩා විහිළුවක් එහි පිටුපස තිබුණි. සැමට ඇත්ත පැහැදිලි කර දීමෙන් පසු ගැටලුව සාමකාමීව විසඳුණි.`
            ];

            for (let i = 1; i <= 10; i++) {
                blocks.push(
                    `පරීක්ෂණ සටහන #${i} — ${topic}\n\n` +
                    `"${topic}" පරීක්ෂණයේදී පෙන්වා දෙන්නේ නිරීක්ෂණ හැකියාව, ඉවසීම සහ සාක්ෂි මත පදනම් වූ තර්කානුකූල සිතුවිල්ල කෙතරම් වැදගත්ද යන්නයි. ` +
                    `හදිසි තීරණ ගන්නවා වෙනුවට කරුණු නිවැරදිව සසඳා බැලීමෙන් ඕනෑම අභිරහසක සැබෑ තතු පහසුවෙන් සොයා ගත හැකිය. ` +
                    `තරුණ රහස් පරීක්ෂකයන්ගේ මෙම ක්‍රමවේදය එදිනෙදා ජීවිතයේ ගැටලු විසඳීමේදීද ඉතා ප්‍රයෝජනවත් වේ.`
                );
            }

            let text = blocks.join('\n\n');
            const wordCount = (s) => s.trim().split(/\s+/).filter(Boolean).length;
            let extra = 1;
            while (wordCount(text) < 2050) {
                text += `\n\nඅතිරේක පරීක්ෂණ සටහන ${extra} (${topic}) — සෑම ඉඟියක්ම කල්පනාකාරීව විශ්ලේෂණය කිරීමෙන් "${topic}" අභිරහසේ සැබෑ විසඳුම නිවැරදිව තහවුරු කරගත හැකිය. බුද්ධිය සහ ඉවසීම සැමවිටම සත්‍යය කරා මඟ පාදයි.`;
                extra++;
            }
            return { text, words: wordCount(text) };
        }

        const stories = topics.map((t, i) => ({ index: i, title: `${i + 1}. ${t}`, ...buildLongDetective(i + 1, t) }));
        const grid = document.getElementById('story-grid');
        const listSec = document.getElementById('detective-list-section');
        const readerSec = document.getElementById('reader-section');
        let currentIdx = 0;

        function openStory(idx) {
            currentIdx = idx;
            const s = stories[idx];
            document.getElementById('reader-num').textContent = `පරීක්ෂණය #${idx + 1} / 50`;
            document.getElementById('reader-words').textContent = `වචන ${s.words.toLocaleString()}+`;
            document.getElementById('reader-title').textContent = s.title;
            document.getElementById('reader-text').textContent = s.text;
            listSec.style.display = 'none';
            readerSec.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeReader() {
            readerSec.classList.remove('active');
            listSec.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function nextStory() {
            openStory((currentIdx + 1) % stories.length);
        }

        stories.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'story-btn';
            btn.textContent = s.title;
            btn.onclick = () => openStory(i);
            grid.appendChild(btn);
        });
    </script>
</body>
</html>
