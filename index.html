<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>කතා ලෝකය 150</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Fredoka:wght@500;700&family=Noto+Sans+Sinhala:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans Sinhala', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #090000;
        }

        .part {
            flex: 1;
            min-height: 33.33vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px 16px;
        }

        .part-1 {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
        }

        .part-2 {
            background: linear-gradient(135deg, #1d4ed8 0%, #0284c7 50%, #0d9488 100%);
        }

        .part-3 {
            background: radial-gradient(circle, #3b0000 0%, #140000 70%, #050000 100%);
        }

        .part-1 h2 {
            font-family: 'Fredoka', 'Noto Sans Sinhala', sans-serif;
            color: #be185d;
            font-size: 2rem;
            margin-bottom: 6px;
            text-shadow: 1px 1px 0 #fff;
        }

        .part-1 p {
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .part-2 h2 {
            font-family: 'Fredoka', 'Noto Sans Sinhala', sans-serif;
            color: #e0f2fe;
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .part-2 p {
            color: #f0f9ff;
            margin-bottom: 14px;
        }

        .part-3 h2 {
            font-family: 'Cinzel Decorative', 'Noto Sans Sinhala', serif;
            color: #ef4444;
            font-size: 1.95rem;
            margin-bottom: 6px;
            text-shadow: 0 0 14px rgba(239, 68, 68, 0.7);
        }

        .part-3 p {
            color: #e5d4d4;
            margin-bottom: 14px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            opacity: 0.95;
        }

        .btn-novel {
            background: linear-gradient(45deg, #ff512f, #dd2476);
            color: #fff;
            border: 2px solid #fff;
        }

        .btn-detective {
            background: linear-gradient(45deg, #fbbf24, #f97316);
            color: #111827;
            border: 2px solid #fef3c7;
        }

        .btn-horror {
            background: linear-gradient(180deg, #7f1d1d, #240000);
            color: #fee2e2;
            border: 2px solid #ef4444;
            border-radius: 8px;
        }

        /* Iframe Overlay */
        #frame-box {
            display: none;
            position: fixed;
            inset: 0;
            background: #050000;
            z-index: 100;
            flex-direction: column;
        }

        #frame-box.open {
            display: flex;
        }

        .frame-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #111827;
            color: #fff;
        }

        .close-btn {
            padding: 7px 16px;
            border: none;
            border-radius: 20px;
            background: #ef4444;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="i.mp3" autoplay loop></audio>

    <section class="part part-1">
        <h2>🌈 කෙටි කතා (Novels)</h2>
        <p>ආදර්ශවත් කෙටි කතා 50</p>
        <button type="button" class="btn btn-novel" onclick="openPage('novel.html', 'n.mp3')">කෙටි කතා බලන්න</button>
    </section>

    <section class="part part-2">
        <h2>🕵️‍♂️ රහස් පරීක්ෂක කතා (Detectives)</h2>
        <p>ළමා රහස් පරීක්ෂක කතා 50</p>
        <button type="button" class="btn btn-detective" onclick="openPage('detectives.html', 'd.mp3')">රහස් කතා බලන්න</button>
    </section>

    <section class="part part-3">
        <h2>🕯️ අඳුරු අභිරහස් කතා (Horror)</h2>
        <p>ළමයින්ට ගැළපෙන අඳුරු අභිරහස් කතා 50</p>
        <button type="button" class="btn btn-horror" onclick="openPage('horror.html', 'h.mp3')">අභිරහස් කතා බලන්න</button>
    </section>

    <div id="frame-box">
        <div class="frame-bar">
            <span id="frame-label">Story Page</span>
            <button type="button" class="close-btn" onclick="closePage()">⬅ ආපසු</button>
        </div>
        <iframe id="page-frame" src=""></iframe>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const frameBox = document.getElementById('frame-box');
        const pageFrame = document.getElementById('page-frame');
        const frameLabel = document.getElementById('frame-label');

        function playSong(file) {
            music.src = file;
            music.play().catch(() => {});
        }

        // Page open වුණු ගමන් i.mp3 play කරන්න උත්සාහ කරයි; browser block කළොත් පළමු click එකේදී play වේ
        window.addEventListener('load', () => {
            music.play().catch(() => {});
        });

        document.addEventListener('click', () => {
            if (music.paused) {
                music.play().catch(() => {});
            }
        }, { once: true });

        function openPage(pageFile, songFile) {
            frameLabel.textContent = pageFile;
            pageFrame.src = pageFile;
            frameBox.classList.add('open');
            playSong(songFile);
        }

        function closePage() {
            frameBox.classList.remove('open');
            pageFrame.src = '';
            playSong('i.mp3');
        }
    </script>
</body>
</html>
