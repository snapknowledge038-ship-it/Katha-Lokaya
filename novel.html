<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Once Upon a Time — කෙටි කතා 50</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans Sinhala', 'Fredoka', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f7fa 0%, #fce4ec 52%, #fff9c4 100%);
            background-attachment: fixed;
            padding: 18px 18px 64px;
            color: #1e293b;
            text-align: center;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* 1. Single Audio Mute Bar */
        .novel-audio-bar {
            max-width: 1240px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
        }

        .mute-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: #ffffff;
            font-size: 1.02rem;
            font-weight: 700;
            border: 2.5px solid #ffffff;
            box-shadow: 0 8px 20px rgba(219, 39, 119, 0.25);
            transition: transform 0.2s ease;
        }

        .mute-btn:hover {
            transform: scale(1.04);
        }

        /* 2. Panoramic Image Banner (i.jpg) */
        .novel-panoramic-wrap {
            position: relative;
            max-width: 1240px;
            width: 100%;
            margin: 0 auto 24px;
            aspect-ratio: 21 / 6;
            min-height: 140px;
            max-height: 260px;
            border-radius: 24px;
            overflow: hidden;
            border: 3px solid #ffffff;
            background: linear-gradient(120deg, #fbcfe8 0%, #bae6fd 50%, #fde68a 100%);
            box-shadow: 0 12px 28px rgba(190, 24, 93, 0.14);
        }

        .novel-panoramic-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .novel-panoramic-img.broken {
            display: none;
        }

        .novel-panoramic-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.62) 0%, rgba(255, 255, 255, 0.22) 50%, rgba(255, 255, 255, 0.62) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            pointer-events: none;
        }

        .novel-banner-title {
            font-family: 'Fredoka', 'Noto Sans Sinhala', sans-serif;
            font-size: clamp(1.55rem, 3.2vw, 2.25rem);
            color: #be185d;
            text-shadow: 2px 2px 0 #ffffff;
            margin-bottom: 4px;
        }

        .novel-banner-sub {
            font-size: clamp(0.92rem, 1.6vw, 1.1rem);
            color: #1e293b;
            font-weight: 700;
            text-shadow: 0 1px 8px rgba(255, 255, 255, 0.9);
        }

        /* 3. 50 Stories Grid */
        #kids-list-section {
            max-width: 1240px;
            margin: 0 auto;
        }

        .grid-50 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .story-btn {
            padding: 16px 14px;
            font-size: 1.04rem;
            font-weight: 700;
            line-height: 1.5;
            min-height: 64px;
            border-radius: 18px;
            border: 2.5px solid #ffffff;
            color: #1e293b;
            background: linear-gradient(135deg, #fbcfe8 0%, #bae6fd 100%);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .story-btn:nth-child(3n) {
            background: linear-gradient(135deg, #fde68a 0%, #bbf7d0 100%);
        }

        .story-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 20px rgba(219, 39, 119, 0.16);
        }

        /* 4. Storytelling Large-Font Reader */
        #reader-section {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.96);
            border: 5px solid #ec4899;
            border-radius: 28px;
            padding: 36px 34px;
            text-align: left;
            box-shadow: 0 18px 40px rgba(190, 24, 93, 0.16);
        }

        #reader-section.active {
            display: block;
        }

        .reader-top-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .story-tag {
            background: #fdf2f8;
            border: 1.5px solid #f472b6;
            color: #be185d;
            padding: 5px 15px;
            border-radius: 999px;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .word-tag {
            background: #eff6ff;
            border: 1.5px solid #60a5fa;
            color: #1d4ed8;
            padding: 5px 15px;
            border-radius: 999px;
            font-size: 0.92rem;
            font-weight: 700;
        }

        #reader-title {
            font-family: 'Fredoka', 'Noto Sans Sinhala', sans-serif;
            font-size: clamp(1.75rem, 3.4vw, 2.3rem);
            color: #be185d;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 2.5px dashed rgba(236, 72, 153, 0.28);
        }

        #reader-text {
            font-size: 1.34rem;
            line-height: 2.18;
            font-weight: 500;
            color: #1e293b;
            white-space: pre-line;
            margin-bottom: 32px;
        }

        .reader-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-back {
            padding: 13px 26px;
            border-radius: 999px;
            background: linear-gradient(45deg, #ff512f, #dd2476);
            color: #ffffff;
            font-size: 1.04rem;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(219, 39, 119, 0.28);
        }

        .btn-next {
            padding: 13px 26px;
            border-radius: 999px;
            background: linear-gradient(45deg, #0284c7, #0d9488);
            color: #ffffff;
            font-size: 1.04rem;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(2, 132, 199, 0.28);
        }

        @media (max-width: 720px) {
            .novel-panoramic-wrap {
                aspect-ratio: 16 / 6;
                min-height: 125px;
                max-height: 185px;
            }
            #reader-section {
                padding: 24px 18px;
            }
            #reader-text {
                font-size: 1.22rem;
                line-height: 2.04;
            }
        }
    </style>
</head>
<body>

    <!-- Single Audio Mute / Unmute Button -->
    <div class="novel-audio-bar">
        <button type="button" id="novel-mute-btn" class="mute-btn" onclick="toggleNovelMute()">
            🔊 Sound On
        </button>
    </div>

    <audio id="novel-audio" src="n.mp3" loop preload="auto"></audio>

    <section id="kids-list-section">
        <!-- Panoramic Banner (i.jpg) -->
        <div class="novel-panoramic-wrap" aria-label="Once Upon a Time Novel Banner">
            <img
                src="i.jpg"
                alt="Once Upon a Time Banner"
                class="novel-panoramic-img"
                onerror="this.classList.add('broken')"
            >
            <div class="novel-panoramic-overlay">
                <h1 class="novel-banner-title">Once Upon a Time • 🌈 කෙටි කතා 50</h1>
                <p class="novel-banner-sub">එකෝමත් එක කාලෙක වුණු ලස්සන කතා, පුංචි ඔයාලට ආදරෙන් කියලා දෙන විදියට.</p>
            </div>
        </div>

        <!-- 50 Story Buttons -->
        <div id="story-grid" class="grid-50"></div>
    </section>

    <!-- Story Reader -->
    <section id="reader-section">
        <div class="reader-top-info">
            <span id="reader-num" class="story-tag">කතාව #1 / 50</span>
            <span id="reader-words" class="word-tag">වචන 1,000+</span>
        </div>
        <h2 id="reader-title"></h2>
        <div id="reader-text"></div>
        <div class="reader-actions">
            <button type="button" class="btn-back" onclick="closeReader()">⬅ කතා ලැයිස්තුවට</button>
            <button type="button" class="btn-next" onclick="nextStory()">ඊළඟ කතාව ➡</button>
        </div>
    </section>

    <script>
        const novelAudio = document.getElementById('novel-audio');
        const muteBtn = document.getElementById('novel-mute-btn');
        let novelMuted = false;

        function syncMuteButton() {
            if (!muteBtn) return;
            muteBtn.textContent = novelMuted ? '🔇 Sound Off (Mute)' : '🔊 Sound On';
        }

        function toggleNovelMute() {
            novelMuted = !novelMuted;
            if (novelAudio) {
                novelAudio.muted = novelMuted;
                if (novelMuted) {
                    novelAudio.pause();
                } else {
                    novelAudio.play().catch(() => {});
                }
            }
            try {
                if (window.parent && window.parent !== window) {
                    const parentAudio = window.parent.document.getElementById('bg-audio');
                    if (parentAudio) {
                        parentAudio.muted = novelMuted;
                        if (novelMuted) {
                            parentAudio.pause();
                        } else {
                            parentAudio.play().catch(() => {});
                        }
                    }
                }
            } catch (err) {}
            syncMuteButton();
        }

        window.addEventListener('load', () => {
            if (!novelMuted && novelAudio) {
                novelAudio.play().catch(() => {});
            }
            syncMuteButton();
        });

        document.addEventListener('pointerdown', () => {
            if (!novelMuted && novelAudio && novelAudio.paused) {
                novelAudio.play().catch(() => {});
            }
        }, { once: true });

        const topics = [
            "රන්වන් පොරොව", "කූඹියා සහ පරෙවියා", "ඉබ්බා සහ හාවා", "පිපාසිත කපුටා", "එකමුතුකමේ බලය",
            "සහයෝගයෙන් සිටි පුංචි කුරුල්ලෝ", "පිරිසිදු පාසල් මිදුල", "වෙලාවට වැඩ කළ සසා", "කරුණාවන්ත අලි පැටියා", "පොත් කියවන්න ආසා කළ මිනූ",
            "ගස් සිටවූ ගමේ ළමයි", "බෙදාගෙන කෑමේ සතුට", "සමාව ඉල්ලන්න ඉගෙනගත් රවි", "අලුත් යාළුවා හඳුනාගත් චමි", "වතුර ඉතිරි කළ පුංචි ගම",
            "තමන්ගේ වැඩ තනිවම කළ නිම්නා", "පුංචි මල් පැළය රැකගත් සෙනුජ", "කීකරු බවේ වටිනාකම", "සතුටින් ඉගෙනගත් පුංචි පන්තිය", "කෘතඥ වෙන්න පුරුදු වුණු තරුණි",
            "ඉවසීමෙන් ප්‍රශ්න විසඳූ දිනුජ", "පරිසරයට ආදරය කළ පුංචි කණ්ඩායම", "සරල ජීවිතයේ සතුට", "අලුත් දෙයක් ඉගෙනගත් කවීන්", "සැමට උදව් කළ පුංචි තරුව",
            "විනෝදයෙන් ක්‍රීඩා කළ යාළුවෝ", "අවංකව පිළිතුරු දුන් ශිෂ්‍යයා", "කාලය අපතේ නොයැවූ කුරුළු පැටියා", "හොඳ වචන කතා කරන්න පුරුදු වුණු මලිති", "අනුන්ගේ දේට ආසා නොකළ පුංචි දරුවා",
            "පුංචි උදව්වකින් ඇති වූ සතුට", "මහන්සි වී පලතුරු වත්ත හැදූ ගොවියා", "සිනහවෙන් ප්‍රශ්න මඟහැරගත් දිනූ", "අලුත් පාඩමක් ඉගෙනගත් පුංචි කණ්ඩායම", "පරිස්සමෙන් ගමන් ගිය පුංචි පිරිස",
            "සත්තුන්ට කරුණාව දැක්වූ සඳුනි", "තමන්ගේ වැරදි හදාගත් නවෝද්‍ය", "පුංචි පුස්තකාලයක් හැදූ ළමයි", "උදෑසන පුරුදු හදාගත් කවින්දි", "විශ්වාසය රැකගත් යාළුවෝ දෙන්නා",
            "සතුට බෙදාගත් පුංචි උත්සවය", "පැන්සලෙන් ඉගෙනගත් ජීවිත පාඩම", "පුංචි ගඟේ පිරිසිදුකම රැකගත් කතාව", "කලබල නොවී තීරණ ගත් පුංචි ළමයා", "හොඳ මිතුරෙකු වීමේ රහස",
            "පුංචි අදහසකින් හැදුණු ලස්සන වැඩක්", "සෑම දිනකම අලුත් යමක් ඉගෙනගත් කතාව", "ආදරයෙන් සහ ගෞරවයෙන් සැලකීම", "පුංචි දරුවන්ගේ ලස්සන සිහිනය", "සැමවිටම සත්‍යය කතා කිරීමේ වටිනාකම"
        ];

        function tellKidsStory1000Plus(topic) {
            let story =
                `එකෝමත් එක කාලෙක, හිරු එළිය ලස්සනට වැටෙන, කුරුල්ලෝ සින්දු කියන සුන්දර පුංචි ගමක "${topic}" ගැන හරිම ලස්සන කතාවක් සිදු වුණා. ` +
                `පුංචි ඔයාලා ළඟින් වාඩි වෙලා හොඳින් අහගෙන ඉන්නකෝ, මම මේ කතාව ඔයාලට ආදරෙන් කියලා දෙන්නම්. ` +
                `ඒ ගමේ හිටිය පුංචි ළමයි සහ යාළුවෝ හැමෝම හරිම සමගියෙන්, ආදරෙන් හිටියා. ` +
                `කවුරුත් ඉක්මනින් තරහා ගන්නේ නැහැ; හොඳ වචන කතා කරනවා, අමාරු වෙලාවට යාළුවන්ට උදව් කරනවා. ` +
                `ඉතින් දවසක් "${topic}" හා සම්බන්ධ පුංචි සිදුවීමක් ආවම හැමෝටම හරිම අලුත් අත්දැකීමක් ලැබුණා.`;

            const tellMoreLines = [
                `ඔයාලා දන්නවද, මුලින්ම මේ දේ වුණාම ටිකක් අමුතු විදියට පෙනුණත්, කවුරුත් කලබල වුණේ නැහැ. එයාලා එකතු වෙලා හෙමින් සැරේ කතා කළා, හොඳින් හිතලා බැලුවා, එකිනෙකාට උදව් කරගත්තා. ඒකෙන් එයාලට තේරුණා එකමුතු වුණාම ඕනෑම දෙයක් ලේසියෙන් කරන්න පුළුවන් කියලා.`,
                `තවත් ලස්සන දෙයක් තමයි ඇත්ත කතා කරන එකයි, වැරැද්දක් වුණාම සමාව ඉල්ලලා ඒක හදාගන්න එකයි. පුංචි ඔයාලත් හැමදාම ඇත්ත කතා කරනවා නම්, යාළුවන් එක්ක බෙදාගෙන කනවා නම්, ගස් වැල් සත්තුන්ට ආදරේ කරනවා නම් ඔයාලගේ හිතත් හැමදාම සතුටින් පිරිලා තියේවි.`,
                `"${topic}" කතාවේ හැම තැනකදීම අපිට කියලා දෙන්නේ පුංචි හොඳ පුරුදු තමයි ලොකු සතුටක් ගේන්නේ කියලයි. අම්මා තාත්තා කියන හොඳ දේවල් අහගෙන, වෙලාවට වැඩ කරගෙන, සිනාසීගෙන ඉන්න ළමයින්ට හැමෝම ගොඩක් ආදරෙයි.`,
                `ඔන්න ඔහොම සවස් වෙද්දී කුරුල්ලෝ කූඩුවලට ගියා වගේ, කතාවේ හිටිය පුංචි යාළුවෝත් හිනා වෙවී ගෙවල්වලට ගියේ හෙටත් අලුත් හොඳ දෙයක් ඉගෙනගන්න. එහෙනම් පුංචි යාළුවනේ, "${topic}" කියන මේ ලස්සන කතාව හැමදාම මතක තියාගන්නකෝ!`
            ];

            const countWords = (txt) => txt.trim().split(/\s+/).filter(Boolean).length;
            let idx = 0;
            while (countWords(story) < 1050) {
                story += `\n\n` + tellMoreLines[idx % tellMoreLines.length];
                idx++;
            }

            return {
                text: story,
                words: countWords(story)
            };
        }

        const stories = topics.map((t, i) => ({
            index: i,
            title: `${i + 1}. ${t}`,
            ...tellKidsStory1000Plus(t)
        }));

        const grid = document.getElementById('story-grid');
        const listSec = document.getElementById('kids-list-section');
        const readerSec = document.getElementById('reader-section');
        let currentIdx = 0;

        function openStory(idx) {
            currentIdx = idx;
            const s = stories[idx];
            document.getElementById('reader-num').textContent = `කතාව #${idx + 1} / 50`;
            document.getElementById('reader-words').textContent = `වචන ${s.words.toLocaleString()}+`;
            document.getElementById('reader-title').textContent = s.title;
            document.getElementById('reader-text').textContent = s.text;
            listSec.style.display = 'none';
            readerSec.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeReader() {
            readerSec.classList.remove('active');
            listSec.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function nextStory() {
            openStory((currentIdx + 1) % stories.length);
        }

        stories.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'story-btn';
            btn.textContent = s.title;
            btn.onclick = () => openStory(i);
            grid.appendChild(btn);
        });
    </script>
</body>
</html>
