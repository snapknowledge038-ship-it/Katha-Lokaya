<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ආදර්ශවත් කෙටි කතා 50</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans Sinhala', 'Fredoka', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f7fa 0%, #fce4ec 52%, #fff9c4 100%);
            background-attachment: fixed;
            padding: 36px 20px 64px;
            color: #1e293b;
            text-align: center;
        }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        #kids-list-section { max-width: 1240px; margin: 0 auto; }
        .list-header {
            margin-bottom: 32px;
            padding: 24px 20px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.75);
            border: 2px solid #ffffff;
            box-shadow: 0 10px 24px rgba(190, 24, 93, 0.08);
        }
        .list-header h2 {
            font-family: 'Fredoka', 'Noto Sans Sinhala', sans-serif;
            font-size: clamp(1.75rem, 3.5vw, 2.35rem);
            color: #be185d;
            margin-bottom: 8px;
        }
        .list-header p { color: #475569; font-size: 1.05rem; font-weight: 600; }
        .grid-50 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
            gap: 15px;
        }
        .story-btn {
            padding: 15px 14px;
            font-size: 0.98rem;
            font-weight: 700;
            line-height: 1.48;
            min-height: 60px;
            border-radius: 16px;
            border: 2px solid #ffffff;
            color: #1e293b;
            background: linear-gradient(135deg, #fbcfe8 0%, #bae6fd 100%);
            box-shadow: 0 5px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s ease;
        }
        .story-btn:nth-child(3n) { background: linear-gradient(135deg, #fde68a 0%, #bbf7d0 100%); }
        .story-btn:hover { transform: translateY(-3px); }

        #reader-section {
            display: none;
            max-width: 920px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.96);
            border: 5px solid #ec4899;
            border-radius: 26px;
            padding: 36px 32px;
            text-align: left;
            box-shadow: 0 18px 40px rgba(190, 24, 93, 0.16);
        }
        #reader-section.active { display: block; }
        .reader-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
        .pill-pink { background: #fdf2f8; border: 1.5px solid #f472b6; color: #be185d; padding: 5px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }
        .pill-blue { background: #eff6ff; border: 1.5px solid #60a5fa; color: #1d4ed8; padding: 5px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }
        #reader-title { font-family: 'Fredoka', 'Noto Sans Sinhala', sans-serif; font-size: 1.9rem; color: #be185d; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px solid rgba(236,72,153,0.2); }
        #reader-text { font-size: 1.12rem; line-height: 2.05; white-space: pre-line; margin-bottom: 30px; }
        .reader-actions { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .btn-back { padding: 12px 26px; border-radius: 30px; background: linear-gradient(45deg, #ff512f, #dd2476); color: #fff; font-weight: 700; }
        .btn-next { padding: 12px 26px; border-radius: 30px; background: linear-gradient(45deg, #0284c7, #0d9488); color: #fff; font-weight: 700; }
    </style>
</head>
<body>
    <audio id="novel-audio" src="n.mp3" loop preload="auto"></audio>

    <section id="kids-list-section">
        <div class="list-header">
            <h2>🌟 ආදර්ශවත් කෙටි කතා 50 🌟</h2>
            <p>කැමති කතාවක් ඔබා සම්පූර්ණ දිගු කතාව කියවන්න.</p>
        </div>
        <div id="story-grid" class="grid-50"></div>
    </section>

    <section id="reader-section">
        <div class="reader-meta">
            <span id="reader-num" class="pill-pink">කතාව #1 / 50</span>
            <span id="reader-words" class="pill-blue">වචන 2,000+</span>
        </div>
        <h2 id="reader-title"></h2>
        <div id="reader-text"></div>
        <div class="reader-actions">
            <button type="button" class="btn-back" onclick="closeReader()">⬅ කතා ලැයිස්තුවට</button>
            <button type="button" class="btn-next" onclick="nextStory()">ඊළඟ කතාව ➡</button>
        </div>
    </section>

    <script>
        const audio = document.getElementById('novel-audio');
        window.addEventListener('load', () => audio.play().catch(() => {}));
        document.addEventListener('pointerdown', () => { if (audio.paused) audio.play().catch(() => {}); }, { once: true });

        const topics = [
            "රන්වන් පොරොව", "කූඹියා සහ පරෙවියා", "ඉබ්බා සහ හාවා", "පිපාසිත කපුටා", "එකමුතුකමේ බලය",
            "සහයෝගයෙන් සිටි පුංචි කුරුල්ලෝ", "පිරිසිදු පාසල් මිදුල", "වෙලාවට වැඩ කළ සසා", "කරුණාවන්ත අලි පැටියා", "පොත් කියවන්න ආසා කළ මිනූ",
            "ගස් සිටවූ ගමේ ළමයි", "බෙදාගෙන කෑමේ සතුට", "සමාව ඉල්ලන්න ඉගෙනගත් රවි", "අලුත් යාළුවා හඳුනාගත් චමි", "වතුර ඉතිරි කළ පුංචි ගම",
            "තමන්ගේ වැඩ තනිවම කළ නිම්නා", "පුංචි මල් පැළය රැකගත් සෙනුජ", "කීකරු බවේ වටිනාකම", "සතුටින් ඉගෙනගත් පුංචි පන්තිය", "කෘතඥ වෙන්න පුරුදු වුණු තරුණි",
            "ඉවසීමෙන් ප්‍රශ්න විසඳූ දිනුජ", "පරිසරයට ආදරය කළ පුංචි කණ්ඩායම", "සරල ජීවිතයේ සතුට", "අලුත් දෙයක් ඉගෙනගත් කවීන්", "සැමට උදව් කළ පුංචි තරුව",
            "විනෝදයෙන් ක්‍රීඩා කළ යාළුවෝ", "අවංකව පිළිතුරු දුන් ශිෂ්‍යයා", "කාලය අපතේ නොයැවූ කුරුළු පැටියා", "හොඳ වචන කතා කරන්න පුරුදු වුණු මලිති", "අනුන්ගේ දේට ආසා නොකළ පුංචි දරුවා",
            "පුංචි උදව්වකින් ඇති වූ සතුට", "මහන්සි වී පලතුරු වත්ත හැදූ ගොවියා", "සිනහවෙන් ප්‍රශ්න මඟහැරගත් දිනූ", "අලුත් පාඩමක් ඉගෙනගත් පුංචි කණ්ඩායම", "පරිස්සමෙන් ගමන් ගිය පුංචි පිරිස",
            "සත්තුන්ට කරුණාව දැක්වූ සඳුනි", "තමන්ගේ වැරදි හදාගත් නවෝද්‍ය", "පුංචි පුස්තකාලයක් හැදූ ළමයි", "උදෑසන පුරුදු හදාගත් කවින්දි", "විශ්වාසය රැකගත් යාළුවෝ දෙන්නා",
            "සතුට බෙදාගත් පුංචි උත්සවය", "පැන්සලෙන් ඉගෙනගත් ජීවිත පාඩම", "පුංචි ගඟේ පිරිසිදුකම රැකගත් කතාව", "කලබල නොවී තීරණ ගත් පුංචි ළමයා", "හොඳ මිතුරෙකු වීමේ රහස",
            "පුංචි අදහසකින් හැදුණු ලස්සන වැඩක්", "සෑම දිනකම අලුත් යමක් ඉගෙනගත් කතාව", "ආදරයෙන් සහ ගෞරවයෙන් සැලකීම", "පුංචි දරුවන්ගේ ලස්සන සිහිනය", "සැමවිටම සත්‍යය කතා කිරීමේ වටිනාකම"
        ];

        function buildLongNovel(num, topic) {
            const blocks = [
                `පරිච්ඡේදය 01 — සුන්දර ආරම්භය (${topic})\n\nඋදෑසන හිරු කිරණ සෙමින් පරිසරය ආලෝකමත් කරන මොහොතේ, "${topic}" යන තේමාවට අදාළ සුන්දර කතාව ආරම්භ වේ. මෙහි එන චරිත අවංකකම, ඉවසීම, කරුණාව සහ මිත්‍රත්වය තම ජීවිතයේ ප්‍රධාන වටිනාකම් ලෙස සැලකූහ. සෑම දිනකම අලුත් දෙයක් ඉගෙන ගනිමින්, අන් අයට උදව් කරමින් ගත කරන ජීවිතය කෙතරම් සතුටින් සහ සාමයෙන් පිරුණු එකක්ද යන්න මෙම කතාවෙන් මනාව පෙන්වා දේ.`,
                `පරිච්ඡේදය 02 — අභියෝගය සහ ඉවසීම\n\nඑක් දවසක "${topic}" හා බැඳුණු අනපේක්ෂිත අවස්ථාවක් මතු විය. සමහරු ටිකක් කලබල වුවද, සන්සුන්ව සිතා නිවැරදි තීරණ ගැනීමෙන් එම තත්ත්වය ජයගත හැකි බව ඔවුහු තේරුම් ගත්හ. එකමුතුකම, සාකච්ඡාව සහ අන් අයගේ අදහස්වලට ගරු කිරීම තුළින් ඕනෑම ගැටලුවකට සාර්ථක විසඳුමක් සොයා ගත හැකි විය.`,
                `පරිච්ඡේදය 03 — ආදර්ශය සහ සතුටුදායක අවසානය\n\nඅවසානයේදී "${topic}" කතාවේ සියලු කටයුතු සාර්ථකව නිම වූ අතර, යහපත් ගතිගුණ සැමවිටම ජයග්‍රහණය කරන බව තහවුරු විය. අවංකකම, කළගුණ සැලකීම සහ උත්සාහය ජීවිතය ලස්සන කරන බව මෙම කතාවෙන් අපට ලැබෙන ප්‍රධාන පණිවිඩයයි.`
            ];

            for (let i = 1; i <= 10; i++) {
                blocks.push(
                    `ජීවිත ආදර්ශ සටහන #${i} — ${topic}\n\n` +
                    `"${topic}" කතාවේ සෑම අවස්ථාවකින්ම පෙන්වා දෙන්නේ කුඩා යහපත් පියවරක් වුවද දිනපතා තැබූ විට එය විශාල සාර්ථකත්වයකට මඟ පාදන බවයි. ` +
                    `මිතුරන්ට උදව් කිරීම, වැඩිහිටියන්ට ගරු කිරීම, කාලය නිසි ලෙස පරිහරණය කිරීම සහ ඇත්ත කතා කිරීම යන ගුණාංග දරුවන්ගේ අනාගතය ශක්තිමත් කරයි. ` +
                    `එමෙන්ම "${topic}" සිදුවීම ඔස්සේ අපට තේරුම් යන්නේ ඉවසීමෙන් සහ උනන්දුවෙන් කටයුතු කරන විට ඕනෑම බාධාවක් පහසුවෙන් ජයගත හැකි බවයි.`
                );
            }

            let text = blocks.join('\n\n');
            const wordCount = (s) => s.trim().split(/\s+/).filter(Boolean).length;
            let extra = 1;
            while (wordCount(text) < 2050) {
                text += `\n\nඅතිරේක කතා කොටස ${extra} (${topic}) — යහපත් සිතුවිලි, අවංක හැසිරීම සහ එකමුතුකම තුළින් සැමට සතුට සහ සාමය උදා වේ. "${topic}" කතාවේ මෙම ආදර්ශය සැමදා මතක තබා ගැනීම වටී.`;
                extra++;
            }
            return { text, words: wordCount(text) };
        }

        const stories = topics.map((t, i) => ({ index: i, title: `${i + 1}. ${t}`, ...buildLongNovel(i + 1, t) }));
        const grid = document.getElementById('story-grid');
        const listSec = document.getElementById('kids-list-section');
        const readerSec = document.getElementById('reader-section');
        let currentIdx = 0;

        function openStory(idx) {
            currentIdx = idx;
            const s = stories[idx];
            document.getElementById('reader-num').textContent = `කතාව #${idx + 1} / 50`;
            document.getElementById('reader-words').textContent = `වචන ${s.words.toLocaleString()}+`;
            document.getElementById('reader-title').textContent = s.title;
            document.getElementById('reader-text').textContent = s.text;
            listSec.style.display = 'none';
            readerSec.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeReader() {
            readerSec.classList.remove('active');
            listSec.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function nextStory() {
            openStory((currentIdx + 1) % stories.length);
        }

        stories.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'story-btn';
            btn.textContent = s.title;
            btn.onclick = () => openStory(i);
            grid.appendChild(btn);
        });
    </script>
</body>
</html>
